[project]
name = "langgraph-pg-checkpointer-example"
version = "0.1.0"
description = "Minimal working example of LangGraph agent with PostgreSQL checkpointer"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.1.0",
    "langgraph-checkpoint-postgres>=3.0.5",
    "langchain>=1.2.13",
    "langchain-openai>=1.1.10",
    "psycopg[binary]>=3.3.3",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.6",
]

[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
